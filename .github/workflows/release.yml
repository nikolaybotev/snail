name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide version
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          decision="$(bash scripts/release-version.sh)"
          echo "$decision"
          case "$decision" in
            noop)
              echo "action=noop" >> "$GITHUB_OUTPUT"
              if head_tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"; then
                echo "tag=$head_tag" >> "$GITHUB_OUTPUT"
              else
                echo "release: noop without a semver tag on HEAD" >&2
                exit 1
              fi
              ;;
            tag\ v*)
              tag="${decision#tag }"
              echo "action=tag" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "release: unexpected release-version output: $decision" >&2
              exit 1
              ;;
          esac

      - name: Skip when release already exists
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to upload."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and checksum
        id: build
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          export VERSION="$tag"
          bash scripts/build.sh
          full_sha="$(git rev-parse HEAD)"
          build_ts="$(tar xOf "dist/snail-${tag}.tar.gz" "snail-${tag}/build-stamp.json" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).buildTimestamp")"
          if [[ -z "$build_ts" ]]; then
            echo "release: could not read build timestamp from archive" >&2
            exit 1
          fi
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "build_ts=$build_ts" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.skip.outputs.skip != 'true' && steps.decide.outputs.action == 'tag'
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            existing="$(git rev-parse "refs/tags/${tag}^{commit}")"
            head="$(git rev-parse HEAD)"
            if [[ "$existing" != "$head" ]]; then
              echo "release: tag ${tag} already exists on a different commit" >&2
              exit 1
            fi
          else
            git tag "$tag"
            git push origin "refs/tags/${tag}"
          fi

      - name: Publish GitHub release
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **Build metadata**

            - Commit SHA: `${{ steps.build.outputs.full_sha }}`
            - Built: `${{ steps.build.outputs.build_ts }}`
          files: |
            dist/snail-${{ steps.decide.outputs.tag }}.tar.gz
            dist/SHA256SUMS
